<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#374151"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="490" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">How a call travels through the library</text>
<rect x="340" y="50" width="300" height="62" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="1.4"/>
<text x="490.0" y="73" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Your program</text>
<text x="490.0" y="93" text-anchor="middle" font-size="12" fill="#374151">graph_add_edge(g, u, v, w)   graph_pagerank(g, ...)</text>
<line x1="490" y1="112" x2="490" y2="150" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="190" y="150" width="600" height="96" rx="8" fill="#dcfce7" stroke="#374151" stroke-width="1.4"/>
<text x="490.0" y="173" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Graph handle  (graph.h)</text>
<text x="490.0" y="193" text-anchor="middle" font-size="12" fill="#374151">one API; vertices are integers; every call returns a status or records graph_last_error()</text>
<text x="490.0" y="209" text-anchor="middle" font-size="12" fill="#374151">forwards to whichever representation is active, then tells the observer what happened</text>
<rect x="20" y="150" width="150" height="96" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.4"/>
<text x="95.0" y="173" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Cache</text>
<text x="95.0" y="193" text-anchor="middle" font-size="12" fill="#374151">versioned LRU of</text>
<text x="95.0" y="209" text-anchor="middle" font-size="12" fill="#374151">baseline results</text>
<text x="95.0" y="225" text-anchor="middle" font-size="12" fill="#374151">(BFS, Dijkstra, ...)</text>
<rect x="810" y="150" width="150" height="96" rx="8" fill="#fee2e2" stroke="#374151" stroke-width="1.4"/>
<text x="885.0" y="173" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Memory budget</text>
<text x="885.0" y="193" text-anchor="middle" font-size="12" fill="#374151">4 GiB default;</text>
<text x="885.0" y="209" text-anchor="middle" font-size="12" fill="#374151">too big = clean</text>
<text x="885.0" y="225" text-anchor="middle" font-size="12" fill="#374151">GRAPH_ERR_TOO_LARGE</text>
<line x1="170" y1="198" x2="190" y2="198" stroke="#374151" stroke-width="1.4"/>
<line x1="790" y1="198" x2="810" y2="198" stroke="#374151" stroke-width="1.4"/>
<line x1="340" y1="246" x2="250" y2="300" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><text x="301.0" y="273.0" font-size="11" fill="#6b7280">counts operations</text>
<rect x="60" y="300" width="380" height="110" rx="8" fill="#ffedd5" stroke="#374151" stroke-width="1.4"/>
<text x="250.0" y="323" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Observer  (policy.h, stats.h)</text>
<text x="250.0" y="343" text-anchor="middle" font-size="12" fill="#374151">workload counters (decayed) + graph shape</text>
<text x="250.0" y="359" text-anchor="middle" font-size="12" fill="#374151">+ each backend's cost model decide it:</text>
<text x="250.0" y="375" text-anchor="middle" font-size="12" fill="#374151">migrate when the gain is clear, the saving repays</text>
<text x="250.0" y="391" text-anchor="middle" font-size="12" fill="#374151">the rebuild, and the target fits budget and size limit</text>
<line x1="440" y1="355" x2="560" y2="355" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><text x="506.0" y="355.0" font-size="11" fill="#6b7280">migrate (migrate.h)</text>
<line x1="640" y1="246" x2="640" y2="300" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><text x="646.0" y="273.0" font-size="11" fill="#6b7280">GraphBackend vtable</text>
<rect x="560" y="300" width="190" height="110" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="1.4"/>
<text x="655.0" y="323" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">List backend</text>
<text x="655.0" y="343" text-anchor="middle" font-size="12" fill="#374151">sorted neighbour arrays</text>
<text x="655.0" y="359" text-anchor="middle" font-size="12" fill="#374151">~47 B / edge (23 unweighted)</text>
<text x="655.0" y="375" text-anchor="middle" font-size="12" fill="#374151">any size; grows with edges</text>
<rect x="770" y="300" width="190" height="110" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="1.4"/>
<text x="865.0" y="323" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Matrix backend</text>
<text x="865.0" y="343" text-anchor="middle" font-size="12" fill="#374151">bit rows + sparse weight tiles</text>
<text x="865.0" y="359" text-anchor="middle" font-size="12" fill="#374151">fast has_edge, dense graphs</text>
<text x="865.0" y="375" text-anchor="middle" font-size="12" fill="#374151">size-limited: ~131k / 176k</text>
<text x="490" y="450" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">What you can call on a Graph</text>
<rect x="20" y="464" width="178" height="108" rx="8" fill="#dcfce7" stroke="#374151" stroke-width="1.4"/>
<text x="109.0" y="487" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">graph_algorithms.h</text>
<text x="109.0" y="507" text-anchor="middle" font-size="12" fill="#374151">~90 algorithms:</text>
<text x="109.0" y="523" text-anchor="middle" font-size="12" fill="#374151">paths, flow, matching,</text>
<text x="109.0" y="539" text-anchor="middle" font-size="12" fill="#374151">centrality, communities,</text>
<text x="109.0" y="555" text-anchor="middle" font-size="12" fill="#374151">colouring, cliques, I/O</text>
<rect x="210" y="464" width="178" height="108" rx="8" fill="#dcfce7" stroke="#374151" stroke-width="1.4"/>
<text x="299.0" y="487" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">graph_advanced.h</text>
<text x="299.0" y="507" text-anchor="middle" font-size="12" fill="#374151">graph_adv_*:</text>
<text x="299.0" y="523" text-anchor="middle" font-size="12" fill="#374151">isomorphism, Johnson,</text>
<text x="299.0" y="539" text-anchor="middle" font-size="12" fill="#374151">IDA*, JPS, widest path,</text>
<text x="299.0" y="555" text-anchor="middle" font-size="12" fill="#374151">dynamic connectivity, GNN</text>
<rect x="400" y="464" width="178" height="108" rx="8" fill="#dcfce7" stroke="#374151" stroke-width="1.4"/>
<text x="489.0" y="487" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">graph_social.h</text>
<text x="489.0" y="507" text-anchor="middle" font-size="12" fill="#374151">per-user queries:</text>
<text x="489.0" y="523" text-anchor="middle" font-size="12" fill="#374151">within k hops,</text>
<text x="489.0" y="539" text-anchor="middle" font-size="12" fill="#374151">people you may know,</text>
<text x="489.0" y="555" text-anchor="middle" font-size="12" fill="#374151">bidirectional path</text>
<rect x="590" y="464" width="178" height="108" rx="8" fill="#dcfce7" stroke="#374151" stroke-width="1.4"/>
<text x="679.0" y="487" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">graph_stream.h</text>
<text x="679.0" y="507" text-anchor="middle" font-size="12" fill="#374151">edge-list FILE analyses:</text>
<text x="679.0" y="523" text-anchor="middle" font-size="12" fill="#374151">scan, degrees,</text>
<text x="679.0" y="539" text-anchor="middle" font-size="12" fill="#374151">components in O(V)</text>
<text x="679.0" y="555" text-anchor="middle" font-size="12" fill="#374151">memory (beyond RAM)</text>
<rect x="780" y="464" width="178" height="108" rx="8" fill="#dcfce7" stroke="#374151" stroke-width="1.4"/>
<text x="869.0" y="487" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">graph_viz.h</text>
<text x="869.0" y="507" text-anchor="middle" font-size="12" fill="#374151">pictures of any size:</text>
<text x="869.0" y="523" text-anchor="middle" font-size="12" fill="#374151">SVG / PNG,</text>
<text x="869.0" y="539" text-anchor="middle" font-size="12" fill="#374151">communities, degree,</text>
<text x="869.0" y="555" text-anchor="middle" font-size="12" fill="#374151">matrix heat-map</text>
<text x="490" y="600" text-anchor="middle" font-size="12" fill="#6b7280">Each of these is built on the Graph handle, so it works the same on either representation.</text>
</svg>